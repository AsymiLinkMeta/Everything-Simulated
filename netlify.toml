# Netlify build settings. Redirects live in public/_redirects, headers in public/_headers.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Deploy previews and branch deploys must never be indexed.
[context.deploy-preview.environment]
  VITE_NOINDEX = "true"
[context.branch-deploy.environment]
  VITE_NOINDEX = "true"
