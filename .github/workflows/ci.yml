name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  functions:
    name: Edge functions (deno check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check */index.ts
        working-directory: supabase/functions

  database:
    name: Migrations replay + RLS tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Docker Hub copy of the same image: public.ecr.aws rate-limits anonymous CI pulls.
        image: supabase/postgres:17.11.0.004
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Supabase init scripts
        run: |
          for i in $(seq 1 60); do
            psql "postgres://postgres:postgres@127.0.0.1:5432/postgres" -qtAc \
              "select 1 from information_schema.tables where table_schema='auth' and table_name='users'" | grep -q 1 && break
            sleep 2
          done
          sleep 3
      - run: bash scripts/db-test.sh
        env:
          DB_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          ADMIN_URL: postgres://supabase_admin:postgres@127.0.0.1:5432/postgres

  e2e:
    name: End-to-end (Playwright, local stack)
    runs-on: ubuntu-24.04 # Playwright 1.59 has no chromium build for ubuntu-latest (26.04) yet
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - name: Start local Supabase-compatible stack
        run: local/stack.sh up
      - run: local/migrate.sh
      # seed.sh creates the demo accounts through the gateway's /auth/v1, so start it first.
      - name: Start API gateway and edge functions
        run: |
          nohup deno run -A --node-modules-dir=none local/gateway.ts > gateway.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:54321/health && break; sleep 2; done
      - run: local/seed.sh
      - run: npx playwright install --with-deps chromium
      - name: Playwright
        run: |
          source local/stack.env
          LOCAL_ANON_KEY="$ANON_KEY" npm run e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/.report
            e2e/.results
            gateway.log
          retention-days: 14
